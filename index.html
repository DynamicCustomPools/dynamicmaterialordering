async function uploadWorkOrder(blob, filename, clientName, address) {
  const safeName = new Date().toISOString().slice(0,16).replace(/[T:]/g,"-") + "_" + filename.replace(/[^a-zA-Z0-9\-_.]/g, "_") + ".pdf";
  try {
    await fetch(`${SUPA_URL}/storage/v1/object/work-orders/${safeName}`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${SUPA_KEY}`, "apikey": SUPA_KEY, "Content-Type": "application/pdf", "x-upsert": "true" },
      body: blob
    });

      method: "POST",

function parseAddr(addr) {
  if (!addr) return { street: "", csz: "" };
  // Try to split "123 Main St, Houston, TX 77001" into street + city/state/zip
  const parts = addr.split(",").map(p => p.trim());
  if (parts.length >= 3) return { street: parts[0], csz: parts.slice(1).join(", ") };
  if (parts.length === 2) {
    // Check if second part looks like "City ST ZIP"
    if (/\d{5}/.test(parts[1]) || /[A-Z]{2}\s/.test(parts[1])) return { street: parts[0], csz: parts[1] };
    return { street: addr, csz: "" };
  }
  return { street: addr, csz: "" };
}
function poHeader(title, subtitle, addr, client, today) {
  const a = parseAddr(addr);
  const poLabel = a.street && client ? `${a.street} - ${client}` : (a.street || client || "");
  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #292524;padding-bottom:14px;margin-bottom:16px"><div><img src="${LOGO}" style="height:50px;margin-bottom:8px" /><div style="font-size:20px;font-weight:700;font-family:Georgia,serif">${title}</div>${subtitle ? `<div style="color:#78716c;margin-top:2px;font-size:13px">${subtitle}</div>` : ""}</div><div style="text-align:right;font-size:12px;color:#78716c;line-height:1.8"><div>PO: ${poLabel}</div><div>Date: ${today}</div><div>Client: ${client}</div>${a.street ? `<div>${a.street}</div>` : ""}${a.csz ? `<div>${a.csz}</div>` : ""}</div></div>`;
}

async function downloadPDF(htmlContent, filename, onBlob) {
  // Load jsPDF + AutoTable if needed
  if (!window.jspdf) await new Promise((r, j) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; s.onload = r; s.onerror = j; document.head.appendChild(s); });
  if (!window.jspdf.jsPDF.API.autoTable) await new Promise((r, j) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"; s.onload = r; s.onerror = j; document.head.appendChild(s); });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "letter" });
  const pw = pdf.internal.pageSize.getWidth();
  const m = 12; // margin
  const cw = pw - m * 2; // content width

  // Parse HTML to extract structured data
  const div = document.createElement("div"); div.innerHTML = htmlContent;

  // Try to add logo
  try {
    const logoImg = div.querySelector("img");
    if (logoImg && logoImg.src) pdf.addImage(logoImg.src, "PNG", m, m, 38, 12);
  } catch(e) {}

  // Title
  const titleEl = div.querySelector("div[style*='font-size:20px']") || div.querySelector("div[style*='Georgia']");
  const title = titleEl ? titleEl.textContent.trim() : "Document";
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(18); pdf.setTextColor(28, 25, 23);
  pdf.text(title, m, m + 20);

  // Subtitle
  const subEl = div.querySelector("div[style*='color:#78716c'][style*='font-size:13px']");
  if (subEl) { pdf.setFont("helvetica", "normal"); pdf.setFontSize(10); pdf.setTextColor(120, 113, 108); pdf.text(subEl.textContent.trim(), m, m + 26); }

  // Right-side header info
  const rightDiv = div.querySelector("div[style*='text-align:right']");
  if (rightDiv) {
    pdf.setFont("helvetica", "normal"); pdf.setFontSize(9); pdf.setTextColor(120, 113, 108);
    const lines = rightDiv.querySelectorAll("div");
    let ry = m + 6;
    lines.forEach(l => { pdf.text(l.textContent.trim(), pw - m, ry, { align: "right" }); ry += 4.5; });
  }

  // Separator line
  let curY = m + 30;
  pdf.setDrawColor(41, 37, 36); pdf.setLineWidth(0.8); pdf.line(m, curY, pw - m, curY);
  curY += 4;

  // Extract table sections
  const tables = div.querySelectorAll("table");
  if (tables.length > 0) {
    tables.forEach(table => {
      // Category headers (from tr with colspan)
      const trs = table.querySelectorAll("tr");
      const heads = []; const bodyRows = [];
      const thRow = table.querySelector("thead tr");
      if (thRow) { thRow.querySelectorAll("th").forEach(th => heads.push(th.textContent.trim())); }

      let currentCat = "";
      trs.forEach(tr => {
        const tds = tr.querySelectorAll("td");
        if (tds.length === 0) return;
        // Check if it's a category header (single td with colspan)
        if (tds.length === 1 && tds[0].getAttribute("colspan")) {
          currentCat = tds[0].textContent.trim();
          return;
        }
        // Check if section header (2 columns: label + value)
        if (tds.length === 2 && tds[0].textContent.trim().length < 30) {
          const label = tds[0].textContent.trim();
          const val = tds[1].textContent.trim();
          if (val) bodyRows.push([label, val]);
          return;
        }
        // Regular data row
        const row = [];
        tds.forEach(td => {
          let txt = td.textContent.trim();
          row.push(txt);
        });
        if (row.length && row.some(c => c)) {
          if (currentCat && (bodyRows.length === 0 || bodyRows[bodyRows.length - 1]._cat !== currentCat)) {
            const catRow = new Array(Math.max(row.length, heads.length)).fill("");
            catRow[0] = currentCat; catRow._cat = currentCat; catRow._isCat = true;
            bodyRows.push(catRow);
          }
          bodyRows.push(row);
        }
      });

      // Determine if it's a key-value table (2 cols, label: value) or a data table
      const isKV = heads.length === 0 && bodyRows.every(r => r.length === 2 || r._isCat);

      if (isKV) {
        // Render as section blocks
        let lastCat = "";
        bodyRows.forEach(r => {
          if (r._isCat) {
            if (curY > pdf.internal.pageSize.getHeight() - 20) { pdf.addPage(); curY = m; }
            pdf.setFillColor(245, 240, 235); pdf.rect(m, curY, cw, 7, "F");
            pdf.setFont("helvetica", "bold"); pdf.setFontSize(10); pdf.setTextColor(68, 64, 60);
            pdf.text(r[0], m + 3, curY + 5); curY += 9;
            lastCat = r[0];
            return;
          }
          if (curY > pdf.internal.pageSize.getHeight() - 15) { pdf.addPage(); curY = m; }
          pdf.setFont("helvetica", "normal"); pdf.setFontSize(9); pdf.setTextColor(120, 113, 108);
          pdf.text(r[0], m + 3, curY + 4);
          pdf.setFont("helvetica", "bold"); pdf.setTextColor(28, 25, 23);
          pdf.text(r[1], m + 42, curY + 4);
          pdf.setDrawColor(231, 229, 228); pdf.setLineWidth(0.2); pdf.line(m, curY + 6, pw - m, curY + 6);
          curY += 7;
        });
      } else if (heads.length > 0) {
        // Render with autoTable
        const cleanRows = bodyRows.filter(r => !r._isCat).map(r => {
          while (r.length < heads.length) r.push("");
          return r.slice(0, heads.length);
        });
        const catRows = [];
        let catIdx = 0;
        bodyRows.forEach((r, i) => {
          if (r._isCat) catRows.push({ idx: i - catIdx, text: r[0] }); else catIdx++;
        });
        pdf.autoTable({
          startY: curY,
          margin: { left: m, right: m },
          head: [heads],
          body: cleanRows,
          styles: { fontSize: 8, cellPadding: 2.5, textColor: [28, 25, 23], lineColor: [231, 229, 228], lineWidth: 0.2 },
          headStyles: { fillColor: [255, 255, 255], textColor: [120, 113, 108], fontStyle: "bold", fontSize: 7 },
          alternateRowStyles: { fillColor: [252, 251, 250] },
          didParseCell: (data) => {
            catRows.forEach(c => {
              if (data.row.index === c.idx && data.column.index === 0) {
                data.cell.styles.fontStyle = "bold"; data.cell.styles.fillColor = [245, 240, 235]; data.cell.styles.textColor = [68, 64, 60];
              }
            });
          },
        });
        curY = pdf.lastAutoTable.finalY + 4;
      }
    });
  }

  // Signature lines
  if (curY > pdf.internal.pageSize.getHeight() - 30) { pdf.addPage(); curY = m + 10; }
  curY += 15;
  const sigW = (cw - 10) / 2;
  pdf.setDrawColor(120, 113, 108); pdf.setLineWidth(0.3);
  pdf.line(m, curY, m + sigW, curY);
  pdf.line(m + sigW + 10, curY, pw - m, curY);
  pdf.setFont("helvetica", "normal"); pdf.setFontSize(8); pdf.setTextColor(120, 113, 108);
  pdf.text("Authorized Signature", m, curY + 4);
  pdf.text("Date", m + sigW + 10, curY + 4);

  if (onBlob) { try { onBlob(pdf.output("blob"), filename.replace(/[^a-zA-Z0-9\s\-_.]/g, "") + ".pdf"); } catch(e) {} }
  pdf.save(filename.replace(/[^a-zA-Z0-9\s\-_.]/g, "") + ".pdf");
}

const tsf = l => l / 2;
const tsfRow = r => r.isSpillover ? Number(r.linearFt || 0) * 2 : tsf(Number(r.linearFt || 0));
const cpcs = (l,s,e) => { if (!s||s==="Other"||s==="Ledgerstone") return 0; const[,h]=s.split("x").map(Number); return Math.ceil(l/(h/12))*(e==="Double bullnose"&&(s==="12x12"||s==="12x24")?2:1); };
const csf = (l,s,e) => { if (!s||s==="Other"||s==="Ledgerstone") return 0; const[w]=s.split("x").map(Number); return l*(w/12)*(e==="Double bullnose"&&(s==="12x12"||s==="12x24")?2:1); };
const gCat = s => s==="NPT (National Pool Tile)"?NPT:(s==="Stone Mart"?SM_TILE:AB);

      setTimeout(() => window.scrollTo(0, scrollRef.current), 0);

  const filtered = useMemo(() => {
    const s = q.toLowerCase();
    if (groupedOptions) {
      const r = [];
      Object.entries(groupedOptions).forEach(([g, it]) => { const m = it.filter(i => i.toLowerCase().includes(s)); if (m.length) r.push({ group: g, items: m }); });
      return r;
    }
    return (options || []).filter(o => o.toLowerCase().includes(s));
  }, [q, options, groupedOptions]);
  if (!open) return null;
  const pick = v => { onSelect(v); onClose(); };
  const hasResults = groupedOptions ? filtered.length > 0 : filtered.length > 0;

    : filtered.some(i => i.toLowerCase() === q.toLowerCase());

            style={{ fontSize: 16 }} autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" />

        </div>
      </div>
      <div className="flex-1 overflow-y-auto overscroll-contain" style={{ WebkitOverflowScrolling: "touch" }}>

/* ═══════ PO GEN ═══════ */
function genPO(data, matSections) {
  const sups = new Set();
  if (matSections.tile) sups.add(data.tile.supplier);
  if (matSections.coping) sups.add(data.coping.supplier);
  if (matSections.surface) sups.add(data.surface.supplier);
  const today = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
  const poBase = `PO-${Date.now().toString(36).toUpperCase()}`;
  const pos = [];
  for (const sup of sups) {
    const lines = [];
    if (matSections.tile && data.tile.supplier === sup) data.tile.rows.forEach(r => { const sq = tsfRow(r); const rolled = r.size === "1x2"; lines.push({ cat: "Waterline Tile", item: `${r.name}${r.color ? " – " + r.color : ""}`, size: r.size, area: r.label, lf: r.linearFt, qty: rolled ? sq.toFixed(1) : (sq * OV).toFixed(1), unit: "sq ft", note: "" }); });
    if (matSections.coping && data.coping.supplier === sup) data.coping.rows.forEach(r => { lines.push({ cat: "Coping", item: `${r.stone}${r.stone ? " – " : ""}${r.edge}`, size: r.size, area: r.label, lf: r.linearFt, qty: Math.ceil(cpcs(r.linearFt, r.size, r.edge) * OV).toString(), unit: "pieces", note: "" }); });
    if (matSections.surface && data.surface.supplier === sup) data.surface.rows.forEach(r => {
      const wallRow = data.surface.rows.find(w => w.label.toLowerCase().includes("raised wall"));
      const eff = r.sameAsWall && wallRow ? { series: wallRow.series, color: wallRow.color, size: wallRow.size } : r;
      lines.push({ cat: "Raised Wall", item: `${eff.series}${eff.color ? " – " + eff.color : ""}`, size: eff.size, area: r.label, lf: r.linearFt, qty: (r.linearFt * OV).toFixed(1), unit: "sq ft", note: "" });
    });
    if (lines.length) pos.push({ supplier: sup, lines, poNum: pos.length ? `${poBase}-${pos.length + 1}` : poBase });
  }
  if (matSections.grout && data.grout.color && pos.length) {
    pos[0].lines.push({ cat: "Grout", item: `${data.grout.brand} – ${data.grout.color}`, size: "", area: "", lf: "", qty: "", unit: "", note: "" });
  }
  return { pos, today, client: data.clientName, address: data.address };
}

const BRANDS = ["Jandy","Pentair"];
const getModels = (brand, catId) => (brand === "Pentair" ? PENTAIR_MODELS : JANDY_MODELS)[catId] || [];

function EquipmentPage({ clientName, address, onSave }) {
  const [brand, setBrand] = useState("Jandy");
  const [rows, setRows] = useState(() => EQUIP_CATS.map(c => ({ ...c, description: c.def, qty: c.defQty, notes: "" })));
  const [openCats, setOpenCats] = useState({});
  const [poData, setPoData] = useState(null);
  const [eqSearch, setEqSearch] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [uploadStatus, setUploadStatus] = useState(null);

  const toggleCat = id => setOpenCats(o => ({ ...o, [id]: !o[id] }));
  const updateRow = (idx, field, val) => { setRows(prev => { const r = [...prev]; r[idx] = { ...r[idx], [field]: val }; return r; }); };

  const applyParsed = (parsed) => {
    if (parsed.brand && BRANDS.includes(parsed.brand)) setBrand(parsed.brand);
    if (parsed.items) {
      setRows(prev => prev.map(row => {
        const match = parsed.items[row.id];
        if (match && match.description) return { ...row, description: match.description, qty: match.qty || 0, notes: match.notes || "" };
        return row;
      }));
      const newOpen = {};
      EQUIP_CATS.forEach(c => { if (parsed.items[c.id]?.qty > 0) newOpen[c.id] = true; });
      setOpenCats(newOpen);
    }
  };

  const handlePdfUpload = async (e) => {
    const file = e.target.files?.[0]; if (!file) return; e.target.value = "";
    try { setUploading(true); setUploadStatus("reading");
      const buf = await file.arrayBuffer(); const bytes = new Uint8Array(buf); let bin = "";
      for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      setUploadStatus("analyzing");
      const response = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, system: "Extract pool equipment. ONLY valid JSON.",
          messages: [{ role: "user", content: [{ type: "document", source: { type: "base64", media_type: "application/pdf", data: btoa(bin) } }, { type: "text", text: "Extract equipment. Return JSON." }] }] }) });
      if (!response.ok) throw new Error("API " + response.status);
      const data = await response.json();
      const t = (data.content || []).map(b => b.text || "").filter(Boolean).join("");
      applyParsed(JSON.parse(t.replace(/```json\s*/g, "").replace(/```\s*/g, "").trim()));
      setUploadStatus("done"); setTimeout(() => setUploadStatus(null), 3000);
    } catch (err) { console.error(err); setUploadStatus("error"); setTimeout(() => setUploadStatus(null), 4000); }
    finally { setUploading(false); }
  };

  const handleGenPO = () => {
    const today = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    const poNum = `EQ-${Date.now().toString(36).toUpperCase()}`;
    const lines = rows.filter(r => r.qty > 0 && r.description).map(r => ({
      item: r.description,
      partNum: PART_NUMS[r.description] || "",
      qty: r.qty,
      notes: r.notes,
    }));
    setPoData({ lines, today, poNum, client: clientName, address, brand });
  };

  const handleEqSearchSelect = v => {
    if (eqSearch == null) return;
    updateRow(eqSearch, "description", v);
  };

  const filledCount = rows.filter(r => r.qty > 0 && r.description).length;

  return (
    <div className="px-4 pt-4 pb-6">
      {/* Upload Contract PDF */}
      <div className="mb-4">
        <label className={`w-full py-4 rounded-2xl font-semibold text-base flex items-center justify-center gap-3 transition-all min-h-[56px] border-2 border-dashed cursor-pointer ${uploading ? "border-amber-400 bg-amber-50 text-amber-700" : uploadStatus === "done" ? "border-green-400 bg-green-50 text-green-700" : uploadStatus === "error" ? "border-red-400 bg-red-50 text-red-700" : "border-stone-300 bg-white text-stone-600 hover:bg-stone-50"}`}>
          <input type="file" accept=".pdf,application/pdf" onChange={handlePdfUpload} disabled={uploading} style={{display:"none"}} />
          {uploadStatus === "reading" && <><span className="animate-spin">⏳</span> Reading PDF...</>}
          {uploadStatus === "analyzing" && <><span className="animate-pulse">🤖</span> AI analyzing...</>}
          {uploadStatus === "done" && <><span>✅</span> Equipment auto-filled!</>}
          {uploadStatus === "error" && <><span>❌</span> Failed — try again</>}
          {!uploadStatus && !uploading && <><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3v10M6 7l4-4 4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /><path d="M3 13v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /></svg> Upload Contract PDF</>}
        </label>
        <p className="text-xs text-stone-400 text-center mt-1.5">Paste contract text → AI auto-fills all equipment & quantities</p>
      </div>

      <div className="mb-4">
        <F label="Primary Brand">
          <Sel value={brand} onChange={setBrand} options={BRANDS} noOther />
        </F>
      </div>
      <p className="text-xs text-stone-400 mb-4">{filledCount} of {EQUIP_CATS.length} items configured</p>

      {rows.map((row, idx) => {
        const models = getModels(brand, row.id);
        return (
          <Sec key={row.id} title={row.label} icon={row.icon} open={!!openCats[row.id]} onToggle={() => toggleCat(row.id)}
            count={row.qty > 0 && row.description ? row.qty : null}>
            <div className="space-y-3 mt-3">
              <F label="Description">
                {models.length > 0 ? (
                  <PkBtn value={row.description} placeholder="Tap to select model..." onChange={v => updateRow(idx, "description", v)} onClick={() => setEqSearch(idx)} />
                ) : (
                  <I value={row.description} onChange={v => updateRow(idx, "description", v)} placeholder="Enter description" />
                )}
              </F>
              <div className="grid grid-cols-2 gap-3">
                <F label="Qty">
                  <div className="flex items-center gap-2">
                    <button onClick={() => updateRow(idx, "qty", Math.max(0, row.qty - 1))} className="w-12 h-12 flex items-center justify-center rounded-lg bg-white border border-stone-200 text-stone-500 text-xl active:bg-stone-100">−</button>
                    <div className="flex-1 text-center font-mono text-lg font-bold text-stone-800">{row.qty}</div>
                    <button onClick={() => updateRow(idx, "qty", row.qty + 1)} className="w-12 h-12 flex items-center justify-center rounded-lg bg-white border border-stone-200 text-stone-500 text-xl active:bg-stone-100">+</button>
                  </div>
                </F>
                <F label="Notes"><I value={row.notes} onChange={v => updateRow(idx, "notes", v)} placeholder="Optional" /></F>
              </div>
            </div>
          </Sec>
        );
      })}

      {/* Generate Equipment PO */}
      <button onClick={handleGenPO} className="w-full py-4 rounded-2xl text-white font-semibold text-base flex items-center justify-center gap-3 active:scale-[0.98] transition-all mb-2 min-h-[56px]" style={{ background: "linear-gradient(135deg,#292524,#44403c)" }}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 2h8l4 4v10a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z" stroke="currentColor" strokeWidth="1.5" /><path d="M14 2v4h4M8 10h4M8 13h6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /></svg>
        Generate Equipment PO
      </button>

      {/* Equipment search modal */}
      <SearchModal
        open={eqSearch != null}
        onClose={() => setEqSearch(null)}
        title="Select Model"
        options={eqSearch != null ? getModels(brand, rows[eqSearch]?.id) : []}
        value={eqSearch != null ? rows[eqSearch]?.description : ""}
        onSelect={handleEqSearchSelect}
      />

      {/* Equipment PO Sheet */}
      {poData && (
        <div className="fixed inset-0 z-50 flex items-end" style={{ background: "rgba(0,0,0,0.45)" }} onClick={() => setPoData(null)}>
          <div className="bg-white rounded-t-3xl w-full flex flex-col" style={{ maxHeight: "90vh", paddingBottom: "env(safe-area-inset-bottom)" }} onClick={e => e.stopPropagation()}>
            <div className="flex items-center gap-3 px-5 pt-5 pb-3 border-b border-stone-200">
              <div className="flex-1 min-w-0"><h3 style={{ fontFamily: "'Georgia',serif" }} className="text-lg font-bold text-stone-800 truncate">Equipment PO</h3><p className="text-xs text-stone-400 truncate">{poData.brand} · {poData.poNum}</p></div>
              <button onClick={() => setPoData(null)} className="w-10 h-10 flex items-center justify-center rounded-full bg-stone-100 text-stone-500 text-xl flex-shrink-0">×</button>
            </div>
            <div className="flex-1 overflow-y-auto px-5 py-4" style={{ WebkitOverflowScrolling: "touch" }}>
              <div className="flex justify-center mb-4"><img src={LOGO} alt="Logo" style={{ height: 44 }} /></div>
              <div className="text-xs text-stone-400 mb-3 space-y-0.5">
                <div className="flex justify-between"><span>Client: <strong className="text-stone-600">{poData.client}</strong></span><span>{poData.today}</span></div>
                {poData.address && <div>Address: <strong className="text-stone-600">{poData.address}</strong></div>}
              </div>
              {poData.lines.map((l, i) => (
                <div key={i} className="flex items-center justify-between py-3 border-b border-stone-100">
                  <div className="min-w-0 flex-1 mr-3">
                    <div className="text-sm font-medium text-stone-700">{l.item}</div>
                    <div className="text-xs text-stone-400 mt-0.5">{l.partNum}{l.notes ? ` · ${l.notes}` : ""}</div>
                  </div>
                  <div className="text-right flex-shrink-0">
                    <div className="font-mono font-bold text-lg text-stone-800">{l.qty}</div>
                    <div className="text-xs text-stone-400">ea</div>
                  </div>
                </div>
              ))}
            </div>
            <div className="px-5 pt-3 pb-4 border-t border-stone-200">
              <button onClick={async () => {
                const eqSubject = encodeURIComponent(`Dynamic Custom Pools - ${poData.address} - New equipment order`);
                const eqBody = encodeURIComponent("Hello,\n\nHere is a new equipment order ready for immediate delivery. Please let me know if you have any questions.");
                openEmail(`https://outlook.office.com/mail/deeplink/compose?to=ricky.arredondo@scppool.com&CC=ecom151%40scppool.com&subject=${eqSubject}&body=${eqBody}`);
                const trs = poData.lines.map(l => `<tr><td style="padding:10px 12px;border-bottom:1px solid #e7e5e4">${l.item}</td><td style="padding:10px 12px;border-bottom:1px solid #e7e5e4;color:#78716c;font-size:12px">${l.partNum}</td><td style="padding:10px 12px;border-bottom:1px solid #e7e5e4;text-align:center;font-weight:700">${l.qty}</td><td style="padding:10px 12px;border-bottom:1px solid #e7e5e4;color:#a8a29e;font-size:11px">${l.notes}</td></tr>`).join("");
                const eqHtml = `<div style="font-family:-apple-system,sans-serif;padding:24px;color:#1c1917;font-size:13px">${poHeader("Equipment Purchase Order", poData.brand, poData.address, poData.client, poData.today)}<table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:8px 12px;font-size:11px;text-transform:uppercase;color:#78716c;border-bottom:2px solid #d6d3d1">Item</th><th style="text-align:left;padding:8px 12px;font-size:11px;text-transform:uppercase;color:#78716c;border-bottom:2px solid #d6d3d1">Part #</th><th style="text-align:center;padding:8px 12px;font-size:11px;text-transform:uppercase;color:#78716c;border-bottom:2px solid #d6d3d1">Qty</th><th style="padding:8px 12px;font-size:11px;text-transform:uppercase;color:#78716c;border-bottom:2px solid #d6d3d1">Notes</th></tr></thead><tbody>${trs}</tbody></table><div style="margin-top:48px;display:flex;gap:40px"><div style="flex:1;border-top:1px solid #78716c;padding-top:6px;font-size:11px;color:#78716c">Authorized Signature</div><div style="flex:1;border-top:1px solid #78716c;padding-top:6px;font-size:11px;color:#78716c">Date</div></div></div>`;
                try { await downloadPDF(eqHtml, `${poData.address || poData.client} - Equipment PO`); } catch(e) { console.error("PDF error:", e); }
                if (onSave) onSave("equipment", `${poData.brand} Equipment PO`, eqHtml, `${poData.address || poData.client} - Equipment PO`);
              }} className="w-full py-4 rounded-xl bg-stone-800 text-white font-semibold text-base active:bg-stone-900 transition-colors flex items-center justify-center gap-2 min-h-[52px]">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4.5 6.75V2.25h9v4.5" stroke="currentColor" strokeWidth="1.5" /><rect x="2.25" y="6.75" width="13.5" height="6.75" rx="1" stroke="currentColor" strokeWidth="1.5" /><path d="M4.5 11.25h9v4.5h-9z" stroke="currentColor" strokeWidth="1.5" /></svg>
                Download PDF
              </button>
            </div>
          </div>
        </div>
      )}

      
    </div>
  );
}

/* ═══════ WORK ORDER PAGE ═══════ */
const WO_PLASTER_TYPES = ["Quartz","Mini Pebble"];
const WO_TRIM_TILE_OPTS = ["None","1x1","1x2","2x2","3x3","Other"];
const WO_TRIM_ROWS_OPTS = ["1 Row","2 Rows","3 Rows"];
const WO_JOB_TYPES = ["New Construction","Remodel"];
const WO_COPING_SIZES = ["6x12","12x12","12x24","16x24"];
const WO_COPING_EDGES = ["Paver","Bullnose"];

function WorkOrderPage({ clientName, address: masterAddress, onAddressChange, onSave }) {
  const [wo, setWo] = useState({
    jobType: "", dateRequested: "", isAsap: false, specialNotes: "",
    plasterPool: { type: "", colorStyle: "", measurement: "" },
    plasterSpa: false,
    trimTile: "", trimOther: "", trimColorStyle: "", trimMeasurement: "",
    trimRows: "",
    fullChip: false,
    tileSupplier: "", tileSeries: "", tileColor: "", tileMeasurement: "",
    groutBrand: "", groutName: "",
    copingSupplier: "", copingStone: "", copingSize: "", copingEdge: "", copingMeasurement: "",
    spaCopingSize: "", spaCopingMeasurement: "",
    wallCopingSize: "", wallCopingEdge: "", wallCopingMeasurement: "",
    raisedSupplier: "", raisedSeries: "", raisedColor: "", raisedSize: "", raisedMeasurement: "",
  });
  const [woSections, setWoSections] = useState({ tile: false, coping: false, raised: false });
  const [woSearch, setWoSearch] = useState(null);
  const u = (f, v) => setWo(w => ({ ...w, [f]: v }));
  const uNested = (section, f, v) => setWo(w => ({ ...w, [section]: { ...w[section], [f]: v } }));

  const tileGroups = wo.tileSupplier === "NPT (National Pool Tile)" ? NPT_G : AB_G;
  const tileCat = wo.tileSupplier === "NPT (National Pool Tile)" ? NPT : AB;
  const tileColors = (series) => tileCat[series] || [];
  const copingOpts = wo.copingSupplier === "NPT (National Pool Tile)" ? NPT_COPING_G : (wo.copingSupplier === "Stone Mart" ? SM_COPING_G : null);
  const copingFlat = (wo.copingSupplier === "NPT (National Pool Tile)" || wo.copingSupplier === "Stone Mart") ? null : AB_COPING;
  const vCat = wo.raisedSupplier === "NPT (National Pool Tile)" ? NPT_VENEER : (wo.raisedSupplier === "Stone Mart" ? SM_VENEER : AB_VENEER);
  const vSeries = Object.keys(vCat);
  const vColors = (s) => vCat[s] || [];

  const onWoSelect = (v) => {
    if (!woSearch) return;
    const { field } = woSearch;
    if (field === "tileSeries") { u("tileSeries", v); u("tileColor", ""); }
    else if (field === "tileColor") u("tileColor", v);
    else if (field === "copingStone") u("copingStone", v);
    else if (field === "raisedSeries") { u("raisedSeries", v); u("raisedColor", ""); }
    else if (field === "raisedColor") u("raisedColor", v);
    else if (field === "groutName") u("groutName", v);
    setWoSearch(null);
  };

  const handleCreate = async () => {
    const today = new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
    const woAddr = masterAddress;
    const docTitle = woAddr ? `${woAddr} Radiant Work Order` : "Radiant Work Order";
    const sec = (title, rows) => `<tr><td colspan="3" style="padding:12px;font-weight:700;font-size:14px;background:#f5f0eb;border-bottom:2px solid #d6d3d1">${title}</td></tr>` + rows.filter(r => r[1]).map(r => `<tr><td style="padding:8px 12px;border-bottom:1px solid #e7e5e4;color:#78716c;font-size:12px;width:140px">${r[0]}</td><td colspan="2" style="padding:8px 12px;border-bottom:1px solid #e7e5e4;font-weight:600">${r[1]}</td></tr>`).join("");
    const trimVal = wo.trimTile === "Other" ? wo.trimOther : wo.trimTile;
    const rows = sec("Job Info", [["Type", wo.jobType], ["Client", clientName], ["Date Requested", wo.isAsap ? "ASAP" : wo.dateRequested], ["Special Notes", wo.specialNotes]])
      + sec("Plaster", [["Type", wo.plasterPool.type], ["Color/Style", wo.plasterPool.colorStyle], ["Measurement", wo.plasterPool.measurement], ["Spa", wo.plasterSpa ? "Yes" : "No"], ...(wo.jobType === "Remodel" ? [["Full Chip", wo.fullChip ? "Yes" : "No"]] : [])])
      + sec("Trim", [["Trim Tile", trimVal], ["Color/Style", wo.trimColorStyle], ["Measurement", wo.trimMeasurement], ["Trim Rows", wo.trimRows]])
      + (wo.jobType !== "New Construction" ? (
        (woSections.tile ? sec("Tile", [["Supplier", wo.tileSupplier], ["Series", wo.tileSeries], ["Color", wo.tileColor], ["Measurement", wo.tileMeasurement], ["Grout Brand", wo.groutBrand], ["Grout Name", wo.groutName]]) : "")
        + (woSections.coping ? sec("Coping", [["Supplier", wo.copingSupplier], ["Stone", wo.copingStone], ["Size", wo.copingSize], ["Edge", wo.copingEdge], ["Measurement", wo.copingMeasurement], ["Spa Size", wo.spaCopingSize], ["Spa Measurement", wo.spaCopingMeasurement], ["Raised Wall Size", wo.wallCopingSize], ["Raised Wall Edge", wo.wallCopingEdge], ["Raised Wall Measurement", wo.wallCopingMeasurement]]) : "")
        + (woSections.raised ? sec("Raised Surfaces", [["Supplier", wo.raisedSupplier], ["Type", wo.raisedSeries], ["Color", wo.raisedColor], ["Size", wo.raisedSize], ["Measurement", wo.raisedMeasurement]]) : "")
      ) : "");
    const woHtml = `<div style="font-family:-apple-system,sans-serif;padding:24px;color:#1c1917;font-size:13px">${poHeader("Radiant Work Order", "", woAddr, clientName, today)}<table style="width:100%;border-collapse:collapse">${rows}</table><div style="margin-top:48px;display:flex;gap:40px"><div style="flex:1;border-top:1px solid #78716c;padding-top:6px;font-size:11px;color:#78716c">Authorized Signature</div><div style="flex:1;border-top:1px solid #78716c;padding-top:6px;font-size:11px;color:#78716c">Date</div></div></div>`;
    const emailSubject = encodeURIComponent(`New Work Order - ${woAddr}`);
    const emailBody = encodeURIComponent("Hi Marisol," + "\n\n" + "Here is a new work order for the above address. Please let me know if you have any questions." + "\n\n" + "Ashton");
    openEmail(`https://outlook.office.com/mail/deeplink/compose?to=info@radiantpoolplastering.com&subject=${emailSubject}&body=${emailBody}`);
    try { await downloadPDF(woHtml, docTitle, (blob) => { uploadWorkOrder(blob, docTitle, clientName, woAddr); }); } catch(e) { console.error("PDF error:", e); }
    if (onSave) onSave("workorder", docTitle, woHtml, docTitle);
  };

  return (
    <div className="px-4 pt-4 pb-6">
      <Sec title="Job Info" icon="📋" open={true} onToggle={() => {}}>
        <div className="mt-3 space-y-3">
          <div className="grid grid-cols-2 gap-3">
            <F label="New or Remodel"><Sel value={wo.jobType} onChange={v => u("jobType", v)} options={["Select type", ...WO_JOB_TYPES]} noOther /></F>
            <F label="Date Requested"><div className="flex items-center gap-2"><I value={wo.dateRequested} onChange={v => u("dateRequested", v)} placeholder="Pick a date" type="date" /><button onClick={() => { u("isAsap", !wo.isAsap); u("dateRequested", ""); }} className={`px-3 py-2 rounded-lg text-xs font-bold flex-shrink-0 transition-colors ${wo.isAsap ? "bg-amber-500 text-white" : "bg-stone-200 text-stone-600"}`}>ASAP</button></div></F>
          </div>
          <F label="Special Notes"><textarea value={wo.specialNotes} onChange={e => u("specialNotes", e.target.value)} placeholder="Enter any special notes..." className={`${ib} resize-none`} style={{ fontSize: 16, minHeight: 80 }} /></F>
        </div>
      </Sec>

      <Sec title="Plaster" icon="🏗️" open={true} onToggle={() => {}}>
        <div className="mt-3 space-y-3">
          <div className="grid grid-cols-3 gap-3">
            <F label="Type"><Sel value={wo.plasterPool.type} onChange={v => uNested("plasterPool", "type", v)} options={WO_PLASTER_TYPES} /></F>
            <F label="Color/Style"><I value={wo.plasterPool.colorStyle} onChange={v => uNested("plasterPool", "colorStyle", v)} placeholder="e.g. French Gray" /></F>
            <F label="Measurement"><I value={wo.plasterPool.measurement} onChange={v => uNested("plasterPool", "measurement", v)} placeholder="e.g. 405" /></F>
          </div>
          <div className="text-xs font-semibold text-stone-500 uppercase tracking-wider">Spa</div>
          <div className="grid grid-cols-2 gap-2">
            {[true, false].map(v => (<button key={String(v)} onClick={() => u("plasterSpa", v)} className={`py-3 rounded-xl font-bold text-base transition-all ${wo.plasterSpa === v ? "bg-stone-800 text-white" : "bg-white border border-stone-200 text-stone-500 active:bg-stone-100"}`}>{v ? "Yes" : "No"}</button>))}
          </div>
          {wo.jobType === "Remodel" && (<><div className="h-px bg-stone-200" /><div className="text-xs font-semibold text-stone-500 uppercase tracking-wider">Full Chip</div><div className="grid grid-cols-2 gap-2">{[true, false].map(v => (<button key={String(v)} onClick={() => u("fullChip", v)} className={`py-3 rounded-xl font-bold text-base transition-all ${wo.fullChip === v ? "bg-stone-800 text-white" : "bg-white border border-stone-200 text-stone-500 active:bg-stone-100"}`}>{v ? "Yes" : "No"}</button>))}</div></>)}
          <div className="h-px bg-stone-200" />
          <div className="text-xs font-semibold text-stone-500 uppercase tracking-wider">Trim Tile</div>
          <div className="grid grid-cols-3 gap-3">
            <F label="Size"><Sel value={wo.trimTile} onChange={v => { u("trimTile", v); if (v !== "Other") u("trimOther", ""); }} options={WO_TRIM_TILE_OPTS} noOther /></F>
            <F label="Color/Style"><I value={wo.trimColorStyle} onChange={v => u("trimColorStyle", v)} placeholder="" /></F>
            <F label="Measurement"><I value={wo.trimMeasurement} onChange={v => u("trimMeasurement", v)} placeholder="" /></F>
          </div>
          {wo.trimTile === "Other" && <F label="Custom Trim Size"><I value={wo.trimOther} onChange={v => u("trimOther", v)} placeholder="Enter trim tile size" /></F>}
          <F label="Trim Rows"><Sel value={wo.trimRows} onChange={v => u("trimRows", v)} options={WO_TRIM_ROWS_OPTS} /></F>
        </div>
      </Sec>

      {wo.jobType !== "New Construction" && (<>

      {/* Tile checkbox + section */}
      <div className="mt-4 mb-2 flex items-center gap-3 px-1">
        <input type="checkbox" checked={woSections.tile} onChange={e => setWoSections(s => ({ ...s, tile: e.target.checked }))} className="w-5 h-5 rounded border-stone-300 accent-amber-500" />
        <span className={`text-sm font-semibold ${woSections.tile ? "text-stone-800" : "text-stone-400"}`}>🔷 Tile</span>
      </div>
      {woSections.tile && (
      <Sec title="Tile" icon="🔷" open={true} onToggle={() => {}}>
        <div className="mt-3 space-y-3">
          <F label="Supplier"><Sel value={wo.tileSupplier} onChange={v => { u("tileSupplier", v); u("tileSeries", ""); u("tileColor", ""); }} options={TILE_SUPS} /></F>
          {!TILE_SUPS.includes(wo.tileSupplier) ? (
            <div className="grid grid-cols-2 gap-3">
              <F label="Series / Name"><I value={wo.tileSeries} onChange={v => u("tileSeries", v)} placeholder="Type series name" /></F>
              <F label="Color"><I value={wo.tileColor} onChange={v => u("tileColor", v)} placeholder="Type color" /></F>
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-3">
              <F label="Series"><PkBtn value={wo.tileSeries} placeholder="Tap to search..." onChange={v => u("tileSeries", v)} onClick={() => setWoSearch({ field: "tileSeries", title: "Tile Series", groupedOptions: tileGroups })} /></F>
              <F label="Color">{tileColors(wo.tileSeries).length > 0 ? <PkBtn value={wo.tileColor} placeholder="Tap to search..." onChange={v => u("tileColor", v)} onClick={() => setWoSearch({ field: "tileColor", title: "Colors", options: tileColors(wo.tileSeries) })} /> : <I value={wo.tileColor} onChange={v => u("tileColor", v)} placeholder={wo.tileSeries ? "Type color" : "Select series first"} />}</F>
            </div>
          )}
          <F label="Measurement"><I value={wo.tileMeasurement} onChange={v => u("tileMeasurement", v)} placeholder="" /></F>
          <div className="text-xs font-semibold text-stone-500 uppercase tracking-wider">Tile Grout</div>
          <F label="Brand"><Sel value={wo.groutBrand} onChange={v => { u("groutBrand", v); u("groutName", ""); }} options={GROUT_BRANDS} /></F>
          <F label="Color"><PkBtn value={wo.groutName} placeholder="Tap to search colors..." onChange={v => u("groutName", v)} onClick={() => setWoSearch({ field: "groutName", title: "Grout Color", options: getGroutColors(wo.groutBrand) })} /></F>
        </div>
      </Sec>
      )}

      {/* Coping checkbox + section */}
      <div className="mt-4 mb-2 flex items-center gap-3 px-1">
        <input type="checkbox" checked={woSections.coping} onChange={e => setWoSections(s => ({ ...s, coping: e.target.checked }))} className="w-5 h-5 rounded border-stone-300 accent-amber-500" />
        <span className={`text-sm font-semibold ${woSections.coping ? "text-stone-800" : "text-stone-400"}`}>🧱 Coping</span>
      </div>
      {woSections.coping && (
      <Sec title="Coping" icon="🧱" open={true} onToggle={() => {}}>
<div className="mt-3 space-y-3">
          <F label="Supplier"><Sel value={wo.copingSupplier} onChange={v => { u("copingSupplier", v); u("copingStone", ""); }} options={SUPS} /></F>
          <div className="text-xs font-semibold text-stone-500 uppercase tracking-wider">Pool Coping</div>
          {!SUPS.includes(wo.copingSupplier) ? (
            <F label="Stone / Color"><I value={wo.copingStone} onChange={v => u("copingStone", v)} placeholder="Type stone name and color" /></F>
          ) : (
            <F label="Stone Color"><PkBtn value={wo.copingStone} placeholder="Tap to search..." onChange={v => u("copingStone", v)} onClick={() => setWoSearch({ field: "copingStone", title: "Coping Stone", groupedOptions: copingOpts, options: copingFlat })} /></F>
          )}
          <div className="grid grid-cols-3 gap-3">
            <F label="Size"><Sel value={wo.copingSize} onChange={v => u("copingSize", v)} options={WO_COPING_SIZES} /></F>
            <F label="Edge"><Sel value={wo.copingEdge} onChange={v => u("copingEdge", v)} options={WO_COPING_EDGES} /></F>
            <F label="Measurement"><I value={wo.copingMeasurement} onChange={v => u("copingMeasurement", v)} placeholder="" /></F>
          </div>
          <div className="text-xs font-semibold text-stone-500 uppercase tracking-wider">Spa Coping</div>
          <div className="bg-stone-50 rounded-xl p-3 space-y-2">
            <div className="text-xs text-stone-400">Same as Pool: <strong className="text-stone-600">{wo.copingStone || "—"}</strong> · {wo.copingEdge}</div>
            <div className="grid grid-cols-2 gap-3">
              <F label="Size"><Sel value={wo.spaCopingSize} onChange={v => u("spaCopingSize", v)} options={WO_COPING_SIZES} /></F>
              <F label="Measurement"><I value={wo.spaCopingMeasurement} onChange={v => u("spaCopingMeasurement", v)} placeholder="" /></F>
            </div>
          </div>
          <div className="text-xs font-semibold text-stone-500 uppercase tracking-wider">Raised Wall Coping</div>
          <div className="bg-stone-50 rounded-xl p-3 space-y-2">
            <div className="text-xs text-stone-400">Same stone as Pool: <strong className="text-stone-600">{wo.copingStone || "—"}</strong></div>
            <div className="grid grid-cols-3 gap-3">
              <F label="Size"><Sel value={wo.wallCopingSize} onChange={v => u("wallCopingSize", v)} options={WO_COPING_SIZES} /></F>
              <F label="Edge"><Sel value={wo.wallCopingEdge} onChange={v => u("wallCopingEdge", v)} options={WO_COPING_EDGES} /></F>
              <F label="Measurement"><I value={wo.wallCopingMeasurement} onChange={v => u("wallCopingMeasurement", v)} placeholder="" /></F>
            </div>
          </div>
        </div>
      
      </Sec>
      )}

      {/* Raised Surfaces checkbox + section */}
      <div className="mt-4 mb-2 flex items-center gap-3 px-1">
        <input type="checkbox" checked={woSections.raised} onChange={e => setWoSections(s => ({ ...s, raised: e.target.checked }))} className="w-5 h-5 rounded border-stone-300 accent-amber-500" />
        <span className={`text-sm font-semibold ${woSections.raised ? "text-stone-800" : "text-stone-400"}`}>🪨 Raised Surfaces</span>
      </div>
      {woSections.raised && (
      <Sec title="Raised Surfaces" icon="🪨" open={true} onToggle={() => {}}>
<div className="mt-3 space-y-3">
          <F label="Supplier"><Sel value={wo.raisedSupplier} onChange={v => { u("raisedSupplier", v); u("raisedSeries", ""); u("raisedColor", ""); }} options={SUPS} /></F>
          {!SUPS.includes(wo.raisedSupplier) ? (
            <div className="grid grid-cols-2 gap-3">
              <F label="Type"><I value={wo.raisedSeries} onChange={v => u("raisedSeries", v)} placeholder="Type surface type" /></F>
              <F label="Color"><I value={wo.raisedColor} onChange={v => u("raisedColor", v)} placeholder="Type color" /></F>
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-3">
              <F label="Type"><PkBtn value={wo.raisedSeries} placeholder="Tap to search..." onChange={v => u("raisedSeries", v)} onClick={() => setWoSearch({ field: "raisedSeries", title: "Surface Type", options: vSeries })} /></F>
              <F label="Color">{vColors(wo.raisedSeries).length > 0 ? <PkBtn value={wo.raisedColor} placeholder="Tap to search..." onChange={v => u("raisedColor", v)} onClick={() => setWoSearch({ field: "raisedColor", title: "Surface Color", options: vColors(wo.raisedSeries) })} /> : <I value={wo.raisedColor} onChange={v => u("raisedColor", v)} placeholder={wo.raisedSeries ? "Type color" : "Select type first"} />}</F>
            </div>
          )}
          <div className="grid grid-cols-2 gap-3">
            <F label="Size"><I value={wo.raisedSize} onChange={v => u("raisedSize", v)} placeholder="e.g. 2x4" /></F>
            <F label="Measurement"><I value={wo.raisedMeasurement} onChange={v => u("raisedMeasurement", v)} placeholder="e.g. 29" /></F>
          </div>
        </div>
      
      </Sec>
      )}
      </>)}

      <button onClick={handleCreate} className="w-full py-4 rounded-2xl text-white font-semibold text-base flex items-center justify-center gap-3 active:scale-[0.98] transition-all mt-4 min-h-[56px]" style={{ background: "linear-gradient(135deg,#292524,#44403c)" }}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 2h8l4 4v10a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z" stroke="currentColor" strokeWidth="1.5" /><path d="M14 2v4h4M8 10h4M8 13h6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /></svg>
        Create Work Order
      </button>

      <SearchModal open={!!woSearch} onClose={() => setWoSearch(null)} title={woSearch?.title || ""} groupedOptions={woSearch?.groupedOptions} options={woSearch?.options} value="" onSelect={onWoSelect} />
    </div>
  );
}

/* ═══════ PAST ORDERS OVERLAY ═══════ */
function PastOrdersOverlay({ onClose, initFilter }) {
  const [filter, setFilter] = useState(initFilter || "all");
  const [orders, setOrders] = useState([]);
  useEffect(() => {
    try {
      const raw = localStorage.getItem("dcp_orders");
      const parsed = JSON.parse(raw || "[]");
      
      setOrders(parsed);
    } catch (e) {
      
      setOrders([]);
    }
  }, []);
  const filtered = orders.filter(o => filter === "all" || o.type === filter);
  const del = (id) => {
    const upd = orders.filter(o => o.id !== id);
    setOrders(upd);
    try { localStorage.setItem("dcp_orders", JSON.stringify(upd)); } catch {}
  };
  return (
    <div className="fixed inset-0 z-50 bg-white flex flex-col" style={{ paddingTop: "env(safe-area-inset-top)" }}>
      <div className="flex items-center gap-3 px-4 py-3 border-b border-stone-200 bg-stone-50">
        <button onClick={onClose} className="w-10 h-10 flex items-center justify-center rounded-full text-stone-500 active:bg-stone-200 text-xl flex-shrink-0">←</button>
        <h2 style={{ fontFamily: "'Georgia',serif" }} className="text-lg font-bold text-stone-800">Past Orders</h2>
        {orders.length > 0 && <span className="text-xs bg-amber-400 text-stone-800 font-bold px-2 py-0.5 rounded-full">{orders.length}</span>}
      </div>
      <div className="flex gap-1 px-3 py-2 bg-stone-50 border-b border-stone-100 overflow-x-auto">
        {[["all","All"],["materials","Materials"],["stubout","Stub Out"],["equipment","Equipment"],["workorder","Work Orders"]].map(([k,l]) => (
          <button key={k} onClick={() => setFilter(k)} className={`px-3 py-1.5 rounded-full text-xs font-semibold flex-shrink-0 transition-colors ${filter === k ? "bg-stone-800 text-white" : "bg-white border border-stone-200 text-stone-500"}`}>{l}</button>
        ))}
      </div>
      <div className="flex-1 overflow-y-auto" style={{ WebkitOverflowScrolling: "touch" }}>
        {filtered.length === 0 ? (
          <div className="px-6 py-12 text-center text-stone-400">
            <div className="text-4xl mb-3">📭</div>
            <div className="text-sm">No {filter === "all" ? "" : filter + " "}orders yet</div>
            <div className="text-xs mt-1">Generated POs and Work Orders will appear here</div>
          </div>
        ) : filtered.map(order => (
          <div key={order.id} className="flex items-center gap-3 px-4 py-4 border-b border-stone-100">
            <div className="w-10 h-10 rounded-xl bg-stone-100 flex items-center justify-center text-lg flex-shrink-0">
              {order.type === "materials" ? "🎨" : order.type === "stubout" ? "🔧" : order.type === "equipment" ? "⚙️" : "📝"}
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-sm font-semibold text-stone-800 truncate">{order.label}</div>
              <div className="text-xs text-stone-400">{order.client || ""}{order.address ? " · " + order.address.split(",")[0] : ""}</div>
              <div className="text-xs text-stone-300">{new Date(order.date).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" })}</div>
            </div>
            <button onClick={() => del(order.id)} className="w-8 h-8 flex items-center justify-center rounded-full text-stone-300 active:text-red-500 active:bg-red-50 flex-shrink-0 text-lg">×</button>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(init);
  const [open, setOpen] = useState({ tile: true, grout: false, coping: false, surface: false, summary: true });
  const [matSections, setMatSections] = useState({ tile: false, grout: false, coping: false, surface: false });
  const [poData, setPoData] = useState(null);
  const [search, setSearch] = useState(null);
  const toggle = k => setOpen(o => ({ ...o, [k]: !o[k] }));

  const poolRow = data.tile.rows.find(r => r.label.toLowerCase().includes("pool") && !r.label.toLowerCase().includes("rolled"));
  const catalog = gCat(data.tile.supplier);
  const groups = gGrp(data.tile.supplier);
  const colors = n => catalog[n] || [];

  const copingOptions = data.coping.supplier === "NPT (National Pool Tile)" ? NPT_COPING_G : (data.coping.supplier === "Stone Mart" ? SM_COPING_G : null);
  const copingFlat = (data.coping.supplier === "NPT (National Pool Tile)" || data.coping.supplier === "Stone Mart") ? null : AB_COPING;
  const veneerCat = data.surface.supplier === "NPT (National Pool Tile)" ? NPT_VENEER : (data.surface.supplier === "Stone Mart" ? SM_VENEER : AB_VENEER);
  const veneerSeries = Object.keys(veneerCat);
  const veneerColors = s => veneerCat[s] || [];

  const updateTile = useCallback((i, f, v) => { setData(d => { const rows = [...d.tile.rows]; rows[i] = { ...rows[i], [f]: v }; if (f === "name") rows[i].color = ""; return { ...d, tile: { ...d.tile, rows } }; }); }, []);
  const updateCoping = useCallback((i, f, v) => { setData(d => { const rows = [...d.coping.rows]; rows[i] = { ...rows[i], [f]: v }; return { ...d, coping: { ...d.coping, rows } }; }); }, []);
  const updateSurface = useCallback((i, f, v) => { setData(d => { const rows = [...d.surface.rows]; rows[i] = { ...rows[i], [f]: v }; if (f === "series") rows[i].color = ""; return { ...d, surface: { ...d.surface, rows } }; }); }, []);
  const chgTileSup = v => setData(d => ({ ...d, tile: { supplier: v, rows: d.tile.rows.map(r => ({ ...r, name: "", color: "", sameAsPool: false })) } }));
  const chgCopingSup = v => setData(d => ({ ...d, coping: { supplier: v, rows: d.coping.rows.map(r => ({ ...r, stone: "" })) } }));
  const chgSurfSup = v => setData(d => ({ ...d, surface: { supplier: v, rows: d.surface.rows.map(r => ({ ...r, series: "", color: "" })) } }));
  const addTile = () => setData(d => ({ ...d, tile: { ...d.tile, rows: [...d.tile.rows, { label: "", name: "", color: "", size: "6x6", linearFt: 0, sameAsPool: false }] } }));
  const addCoping = () => setData(d => ({ ...d, coping: { ...d.coping, rows: [...d.coping.rows, { label: "", stone: "", edge: "Paver", size: "12x24", linearFt: 0 }] } }));
  const addSurface = () => setData(d => ({ ...d, surface: { ...d.surface, rows: [...d.surface.rows, { label: "", series: "", color: "", size: "2x4", linearFt: 0 }] } }));
  const rmTile = i => setData(d => ({ ...d, tile: { ...d.tile, rows: d.tile.rows.filter((_, j) => j !== i) } }));
  const rmCoping = i => setData(d => ({ ...d, coping: { ...d.coping, rows: d.coping.rows.filter((_, j) => j !== i) } }));
  const rmSurface = i => setData(d => ({ ...d, surface: { ...d.surface, rows: d.surface.rows.filter((_, j) => j !== i) } }));

  const effRows = useMemo(() => data.tile.rows.map(r => r.sameAsPool && poolRow ? { ...r, name: poolRow.name, color: poolRow.color, size: poolRow.size } : r), [data.tile.rows, poolRow]);

  const summary = useMemo(() => {
    const tt = effRows.filter(r => r.size !== "1x2").reduce((s, r) => s + tsfRow(r), 0) * OV;
    const re = effRows.filter(r => r.size === "1x2").reduce((s, r) => s + tsfRow(r), 0);
    const cbs = {}; data.coping.rows.forEach(r => { if (!cbs[r.size]) cbs[r.size] = { pcs: 0, stone: r.stone }; cbs[r.size].pcs += cpcs(r.linearFt, r.size, r.edge); });
    Object.keys(cbs).forEach(k => { cbs[k].pcs = Math.ceil(cbs[k].pcs * OV); });
    const sfTotal = data.surface.rows.reduce((s, r) => s + Number(r.linearFt || 0), 0) * OV;
    return { tt, re, cbs, sf: sfTotal };
  }, [effRows, data.coping.rows, data.surface.rows]);

  const desc = r => { let s = r.name || "—"; if (r.color) s += ` – ${r.color}`; return s; };
  const e0 = effRows[0] || {};
  const surfaceItems = data.surface.rows.filter(r => r.linearFt > 0).map(r => {
    const wallRow = data.surface.rows.find(w => w.label.toLowerCase().includes("raised wall"));
    const eff = r.sameAsWall && wallRow ? { series: wallRow.series, color: wallRow.color, size: wallRow.size } : r;
    return {
      label: r.label || "Raised Wall",
      sub: `${eff.series || "—"}${eff.color ? " – " + eff.color : ""} · ${eff.size}`,
      val: (Number(r.linearFt) * OV).toFixed(1),
      unit: "sq ft"
    };
  });
  const items = [
    { label: "Waterline Tile", sub: `${desc(e0)} · ${e0.size || ""}`, val: summary.tt.toFixed(1), unit: "sq ft" },
    ...(summary.re > 0 ? [{ label: "Rolled Edge", sub: "1x2", val: summary.re.toFixed(1), unit: "sq ft" }] : []),
    ...Object.entries(summary.cbs).map(([sz, d]) => ({ label: `${sz} Coping`, sub: d.stone, val: String(d.pcs), unit: "pcs" })),
    ...surfaceItems,
  ];

  const uniqSups = [...new Set([data.tile.supplier, data.coping.supplier, data.surface.supplier])];
  const handlePO = () => { setPoData(genPO({ ...data, tile: { ...data.tile, rows: effRows } }, matSections)); };

  // Search modal handler
  const handleSearchSelect = v => {
    if (!search) return;
    const { section, rowIdx, field } = search;
    if (section === "tile") updateTile(rowIdx, field, v);
    else if (section === "coping") updateCoping(rowIdx, field, v);
    else if (section === "surface") updateSurface(rowIdx, field, v);
    else if (section === "grout") setData(d => ({ ...d, grout: { ...d.grout, color: v } }));
  };

  const [page, setPage] = useState("materials");
  const [menuOpen, setMenuOpen] = useState(false);
  const [showPastOrders, setShowPastOrders] = useState(false);
  const [pastFilter, setPastFilter] = useState("all");
  const [savedOrders, setSavedOrders] = useState(() => {
    try { return JSON.parse(localStorage.getItem("dcp_orders") || "[]"); } catch { return []; }
  });
  const dataRef = useRef(data);
  dataRef.current = data;
  const saveOrder = (type, label, html, filename) => {
    try {
      const d = dataRef.current;
      const existing = JSON.parse(localStorage.getItem("dcp_orders") || "[]");
      const order = { id: Date.now(), type, label, filename, html: html || "", date: new Date().toISOString(), client: d.clientName || "", address: d.address || "" };
      const updated = [order, ...existing].slice(0, 200);
      localStorage.setItem("dcp_orders", JSON.stringify(updated));
      setSavedOrders(updated);
      
    } catch (e) { console.error("Save error:", e); }
  };
  const deleteOrder = (id) => {
    const updated = savedOrders.filter(o => o.id !== id);

      <SearchModal
        open={!!search}
        onClose={() => setSearch(null)}
        title={search?.title || ""}
        groupedOptions={search?.groupedOptions}
        options={search?.options}
        value={search?.value}
        onSelect={handleSearchSelect}
      />

      {/* ─── PO MODALS ─── */}
      {poData && (poData.pos.length === 1 ?
        <POSheet po={poData.pos[0]} today={poData.today} client={poData.client} address={poData.address} onClose={() => setPoData(null)} onSave={saveOrder} /> :
        <POPicker pos={poData.pos} today={poData.today} client={poData.client} address={poData.address} onClose={() => setPoData(null)} onSave={saveOrder} />
      )}

      {/* Close menu on outside click - removed, handled by button toggle */}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script></body></html>
